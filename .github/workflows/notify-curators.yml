name: Notify curators

# Watching the repository only emails people who opted in. This workflow makes
# a new method suggestion actively reach the curators instead.
on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Acknowledge the submitter and assign curators
        uses: actions/github-script@v7
        with:
          script: |
            const curators = ${{ toJSON(vars.CURATORS || 'storaged') }}
              .split(',').map(s => s.trim()).filter(Boolean);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'Thanks for the suggestion — it is now in the curation queue.',
                '',
                'A curator will check the classification against the review axes',
                'and open a pull request against `data/integration_methods_library.csv`.',
                'We may reply here if a classification needs clarification.',
              ].join('\n'),
            });

            if (curators.length) {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  assignees: curators,
                });
              } catch (error) {
                core.warning(`Could not assign curators: ${error.message}`);
              }
            }

      - name: Post to Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          jq -n \
            --arg text "*New atlas submission* — $TITLE" \
            --arg author "$AUTHOR" \
            --arg url "$URL" \
            '{
               text: $text,
               blocks: [
                 {type:"section", text:{type:"mrkdwn", text:($text + "\nby `" + $author + "`")}},
                 {type:"actions", elements:[
                   {type:"button", text:{type:"plain_text", text:"Open issue"}, url:$url}
                 ]}
               ]
             }' \
          | curl -sS -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL"
